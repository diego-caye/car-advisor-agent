# One file for the whole stack. Optional services go through profiles, not
# override files: this way `docker compose up -d` always works and there's no
# chain of `-f` flags to remember.
#
#   docker compose up -d                        db + backend + frontend (+ ollama, see below)
#   docker compose --profile local-llm up -d    forces the profile even if it's not in .env
#
# .env.example ships with COMPOSE_PROFILES=local-llm: with that, the first
# command already includes the "ollama" service and the job that pulls its
# models — all inside Docker, with no dependency on a native Ollama installed
# on whoever clones the repo's machine. The profile assumes an NVIDIA GPU with
# the container toolkit installed. Without a GPU, or to use a native Ollama
# instead (better GPU access on some machines), remove COMPOSE_PROFILES from
# .env and point OLLAMA_API_BASE_CONTAINER at http://host.docker.internal:11434.
#
# backend and frontend mount the source code and reload on their own: editing
# a .py or a .tsx shows up instantly, no `--build` needed. A rebuild is only
# needed when dependencies change (uv.lock, package-lock.json) or the
# Dockerfiles do.

name: asesor

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asesor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asesor}
      POSTGRES_DB: ${POSTGRES_DB:-asesor}
    # Default ports deliberately outside the usual ones (5432, 8000, 5173):
    # it's normal to have other projects occupying them. Changed via env.
    ports:
      - "${POSTGRES_PORT:-5490}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asesor} -d ${POSTGRES_DB:-asesor}"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-asesor}:${POSTGRES_PASSWORD:-asesor}@db:5432/${POSTGRES_DB:-asesor}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5190}
      # In .env it points at localhost, which is what the host scripts use;
      # from the container it has to reach out to the host. With the
      # local-llm profile, set it to http://ollama:11434.
      OLLAMA_API_BASE: ${OLLAMA_API_BASE_CONTAINER:-http://host.docker.internal:11434}
      # Empty = no --reload (production). See the command below.
      RELOAD: ${BACKEND_RELOAD-1}
      # The code lives on the Windows filesystem: inotify events don't cross
      # the bind mount, so watchfiles has to poll instead.
      WATCHFILES_FORCE_POLLING: ${WATCH_POLLING:-true}
    # $$ so the container's shell expands it, not Compose. Deliberately one
    # line: a line break here splits it into two commands and exec keeps only
    # the first one, without --reload.
    command: ["sh", "-c", "exec uvicorn asesor.main:create_app --factory --host 0.0.0.0 --port 8000 $${RELOAD:+--reload --reload-dir /app/src}"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8090}:8000"
    volumes:
      # The package installs in editable mode, so the container runs exactly
      # what's mounted here, directly.
      - ./backend/src:/app/src
      # scripts/ isn't copied into the image (only pyproject.toml, uv.lock
      # and src, see Dockerfile): without this mount, `docker compose exec
      # backend uv run python scripts/ingest_kb.py` failed with "No such file
      # or directory" for whoever clones the repo with just Docker, no native
      # uv/Python.
      - ./backend/scripts:/app/scripts:ro
      # ingest_kb.py resolves its default --kb-dir as
      # Path(__file__).parents[2] / "kb": with scripts/ at /app/scripts, that
      # lands on /kb -- hence this exact mount point, so there's no need to
      # pass --kb-dir by hand or duplicate the path in two places.
      - ./kb:/kb:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://backend:8000
      # Same reason as WATCHFILES_FORCE_POLLING in the backend.
      VITE_POLLING: ${WATCH_POLLING:-true}
      # Only for the dev panel's "View trace in Langfuse" link (spec 08 S7);
      # empty if there's no LANGFUSE_PROJECT_ID in .env, and the link simply
      # doesn't show up (DevPanel.tsx). Same for LANGFUSE_HOST: the backend
      # already uses it to export (telemetry.py) -- plans that aren't the
      # default cloud.langfuse.com (e.g. a HIPAA region) have their own host,
      # and a link built by hand with the default gets stuck loading forever
      # on the wrong host (seen live).
      VITE_LANGFUSE_PROJECT_ID: ${LANGFUSE_PROJECT_ID:-}
      VITE_LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    ports:
      - "${FRONTEND_PORT:-5190}:5173"
    volumes:
      # Only what actually gets edited: node_modules stays the one from the image.
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Vite's dev server takes a few seconds to start answering; without a
      # healthcheck "docker compose ps" marked it ready before it actually responded.
      # 127.0.0.1, not localhost: inside the container localhost resolves to
      # ::1 first, and Vite's dev server only listens on IPv4.
      test:
        ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ollama:
    profiles: ["local-llm"]
    # Pinned version, not :latest: an image that changes on its own on every
    # pull can silently stop understanding OLLAMA_THINK or the /api/show
    # format that model discovery uses (infrastructure/llm/ollama_discovery.py)
    # with no warning at all. 0.24.0 (what this machine uses, ADR-003) isn't
    # enough: gemma4:12b needs 0.30.3+ (0.30.5+ to avoid a known crash in that
    # variant) -- learned the hard way, "pull model manifest: 412 requires a
    # newer version of Ollama". 0.34.0 is the latest stable published as of
    # pinning this.
    image: ollama/ollama:0.34.0
    environment:
      # Ollama silently truncates the context if it isn't told how much to use.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_HOST: 0.0.0.0:11434
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Pulls the four models the app actually uses (agent, guardrail -- which
  # also serves as the eval and title model --, fallback and embeddings)
  # once; the volume keeps them across restarts. It used to only pull two:
  # the backend still started fine, but any turn that touched the fallback or
  # the guardrail failed with "model not found" the first time it was needed.
  #
  # Each with an explicit tag, not :latest -- same reason as the image above,
  # and this way what gets pulled here is always exactly what
  # AGENT_MODEL/GUARDRAIL_MODEL/FALLBACK_MODEL/EMBEDDINGS_MODEL expect to find
  # (see .env.example): a loose tag could resolve to a different variant than
  # the one the rest of the app is configured for.
  #
  # OLLAMA_EXTRA_MODELS (optional, in .env): extra models for the selector,
  # space-separated, e.g. "mistral:7b llama3.1:8b". No need to touch this file
  # or MODEL_CHOICES for them to show up: the backend discovers them on its
  # own against /api/tags at startup (infrastructure/llm/ollama_discovery.py)
  # -- this just leaves them *pulled* for whoever clones the repo and uses
  # this profile, same as the four above.
  ollama-pull:
    profiles: ["local-llm"]
    image: ollama/ollama:0.34.0
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EXTRA_MODELS: ${OLLAMA_EXTRA_MODELS:-}
    volumes:
      - ollama-models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_AGENT_MODEL:-gemma4:12b} &&
       ollama pull ${OLLAMA_GUARDRAIL_MODEL:-qwen3:4b-instruct} &&
       ollama pull ${OLLAMA_FALLBACK_MODEL:-llama3.2:3b} &&
       ollama pull ${OLLAMA_EMBEDDINGS_MODEL:-embeddinggemma:300m} &&
       for m in $$OLLAMA_EXTRA_MODELS; do ollama pull \"$$m\" || exit 1; done"
    restart: "no"

volumes:
  dbdata:
  ollama-models:
