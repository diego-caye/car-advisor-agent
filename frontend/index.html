<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luis · Car Advisor</title>
    <script>
      // Applied before React or the CSS paint anything: without this, a
      // saved dark-theme preference shows briefly in light mode (the
      // classic "flash of wrong theme") until the bundle loads.
      ;(function () {
        try {
          var stored = localStorage.getItem('asesor.theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
